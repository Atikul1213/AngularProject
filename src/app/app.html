<div style="text-align: center;">
    <h1>Counter App</h1>
    <h2 class="count">{{count}}</h2>
    <div>
        <button (click)="Inc()" class="btn bg-red">Increment</button>
        <button (click)="Reset()" class="btn bg-black">Reset</button>
        <button (click)="Dec()" class="btn bg-green">Decrement</button>
    </div>
</div>
